<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>
  </defs>

  <!-- Monogram Container -->
  <g transform="translate(40, 10)">
    <!-- Red Vertical Pillar 'I' -->
    <rect x="100" y="110" width="65" height="210" rx="32.5" fill="url(#redGrad)" />
    
    <!-- Red Graduation Cap -->
    <g transform="translate(85, 30)">
      <!-- Diamond cap top -->
      <polygon points="47.5,10 95,35 47.5,60 0,35" fill="#DC2626" />
      <!-- Cap base -->
      <path d="M 20,42 Q 47.5,62 75,42 L 75,55 Q 47.5,75 20,55 Z" fill="#B91C1C" />
      <!-- Tassel string & button -->
      <circle cx="47.5" cy="35" r="4" fill="#7F1D1D" />
      <path d="M 47.5,35 Q 75,45 82,65" stroke="#B91C1C" stroke-width="3.5" fill="none" />
      <!-- Tassel fringe -->
      <polygon points="78,65 86,65 84,80 76,80" fill="#DC2626" />
    </g>

    <!-- Navy Horizontal Bars for 'E' -->
    <g fill="url(#navyGrad)">
      <!-- Top Bar -->
      <rect x="180" y="70" width="135" height="42" rx="4" />
      <!-- Middle Bar -->
      <rect x="180" y="154" width="115" height="42" rx="4" />
      <!-- Bottom Bar -->
      <rect x="180" y="238" width="145" height="42" rx="4" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- Line 1: EASY IELTS/PTE -->
  <text x="250" y="380" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34">
    <tspan fill="#0F2C59">EASY </tspan>
    <tspan fill="#DC2626">IELTS/PTE</tspan>
  </text>

  <!-- Subtitle line: — GLOBAL EDUCATION — -->
  <g transform="translate(250, 415)">
    <line x1="-190" y1="-5" x2="-140" y2="-5" stroke="#0F2C59" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="4" fill="#0F2C59">GLOBAL EDUCATION</text>
    <line x1="140" y1="-5" x2="190" y2="-5" stroke="#0F2C59" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
